# The whole product: database, API, storefront, admin panel.
#
# `./install.sh` writes the .env this reads and then brings this up. Nothing
# here needs editing for a normal deployment — every value that changes between
# hosts comes from that file.
#
# Ports are published on the loopback interface only. Put a reverse proxy in
# front to terminate TLS and route the two sites; nothing here should face the
# internet directly, and the API in particular trusts the X-Api-Key header as
# proof a request came from one of the two Next servers.

name: bojan

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published at all. The API reaches it over the compose network; an
    # exposed database port is the one thing here with no legitimate caller.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Not merely started: the API migrates on boot, and a migration against
        # a database still initialising fails the container.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Bojan: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Creates the schema on first boot and no-ops afterwards. See
      # MigrateIfRequestedAsync in Program.cs.
      Database__AutoMigrate: 'true'
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      TrustedProxy__ApiKey: ${API_KEY}
      # Idempotent — every table with rows already in it is skipped — so this
      # fills an empty deployment and does nothing to a running one.
      Seed__Enabled: ${SEED_ENABLED}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
      # Card-to-card top-ups. Off unless the store is staffing the review
      # queue — see WalletOptions for why that is a business decision.
      Wallet__ManualTopUpEnabled: ${WALLET_MANUAL_TOPUP_ENABLED}
      Storage__RootPath: /data/uploads
      # Where the file sink writes and the panel's «لاگ سرور» reads. On a volume
      # rather than the container filesystem, because the restart that follows
      # a crash would otherwise take the record of it with it — which is the one
      # moment the log is worth having.
      Logs__Directory: /data/logs
      # Same reasoning as the log directory above, for the key ring that
      # encrypts the mailbox password, the SMS API key and the rest of
      # DependencyInjection's data-protected settings — see its own remarks
      # on AddDataProtection for what a container filesystem default costs.
      DataProtection__KeyPath: /data/keys
      # The API's own address, not the storefront's: this is the process the
      # uploads volume is mounted into, and it is what serves the files back
      # (see UploadedMedia). Pointing this at the storefront meant every
      # uploaded image resolved to a 404 there — nothing on that side ever
      # served /media.
      Storage__PublicBaseUrl: ${PUBLIC_API_URL}/media
      # Only the address used before the owner has opened تنظیمات ← پرداخت. Which
      # gateway takes the money, its merchant id and the real return address are
      # all entered in the panel and stored in the database — a credential that
      # arrives through an environment file is one that ends up in a backup, a
      # shell history and a support screenshot.
      Payment__ReturnUrl: ${PUBLIC_STOREFRONT_URL}/checkout/payment/callback
      # Where the links inside an email point.
      #
      # The API cannot derive this from the request: mail is composed on a
      # background worker, where there is no request. Unset, EmailLinks falls
      # back to its development default of http://localhost:3000 — so every
      # verification link, password reset and order link the shop has ever
      # emailed pointed at the recipient's own machine. A customer clicking one
      # gets a connection error, and the account they were verifying stays
      # unverified.
      Email__Site: ${PUBLIC_STOREFRONT_URL}
      # Whether the stand-in sender may print message bodies to the log — which
      # for a sign-in code means printing the credential itself. Off unless a
      # host says otherwise, and it stays off on a real deployment: the SMS
      # account is configured in تنظیمات ← پیامک, and until it is, dropped codes
      # are logged as errors without their contents. See ConsoleSenderOptions.
      Notifications__AllowConsoleSenders: ${ALLOW_CONSOLE_SENDERS:-false}
    volumes:
      # Product media, backup archives and the log outlive the container.
      - api-uploads:/data/uploads
      - api-backups:/data/backup-archives
      - api-logs:/data/logs
      # ASP.NET Core's data protection key ring — what encrypts the mailbox
      # password, the SMS provider's API key, push settings and the payment
      # gateway's credentials in the database. Left unmounted, the key ring
      # lives in the container's own filesystem, so every rebuild starts a
      # fresh one and every secret encrypted under the old one becomes
      # permanently unreadable — not wrong, not rejected, just silently gone,
      # surfacing later as "the mailbox has no password" with no error to
      # explain why. This volume is what makes a rebuild an upgrade rather
      # than a rotation of every stored credential.
      - api-keys:/data/keys
    ports:
      - '127.0.0.1:${API_PORT}:8080'

  storefront:
    build:
      context: ./frontend
      args:
        APP: storefront
        # Baked into the client bundle, so it must be the URL a *browser* uses,
        # not the compose hostname.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}/api
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_STOREFRONT_URL}
        NEXT_PUBLIC_USE_MOCK_DATA: 'false'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server components talk to the API over the compose network instead of
      # going back out through the proxy.
      API_BASE_URL: http://api:8080/api
      API_KEY: ${API_KEY}
      AUTH_SECRET: ${STOREFRONT_AUTH_SECRET}
    ports:
      - '127.0.0.1:${STOREFRONT_PORT}:3000'

  admin:
    build:
      context: ./frontend
      args:
        APP: admin
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}/api/admin
        NEXT_PUBLIC_USE_MOCK_DATA: 'false'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080/api/admin
      API_KEY: ${API_KEY}
      # Where the panel tells the storefront that something it caches has
      # changed. Over the compose network, never through the proxy: the call
      # carries API_KEY, which both containers already hold and which has no
      # business crossing the public interface. Without this the storefront's
      # tags expire only on their own clock — five minutes for a restocked
      # product, an hour for a newly published article — which is how a save
      # that worked came to look like one that had not.
      STOREFRONT_INTERNAL_URL: http://storefront:3000
      # Deliberately a different secret from the storefront's, so a customer
      # session can never be replayed as an operator session.
      AUTH_SECRET: ${ADMIN_AUTH_SECRET}
    ports:
      - '127.0.0.1:${ADMIN_PORT}:3000'

volumes:
  postgres-data:
  api-uploads:
  api-backups:
  api-logs:
  api-keys:
