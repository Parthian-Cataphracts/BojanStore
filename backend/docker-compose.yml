services:
  postgres:
    image: postgres:17-alpine
    container_name: bojan-postgres
    environment:
      POSTGRES_DB: bojan
      POSTGRES_USER: bojan
      POSTGRES_PASSWORD: bojan_dev_only
    ports:
      # Matches ConnectionStrings:Bojan in appsettings.Development.json.
      - "5432:5432"
    volumes:
      - bojan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bojan -d bojan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bojan-postgres-data:
